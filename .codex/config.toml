[features]
# Fast mode spends extra credits without shortening VM execution.
fast_mode = false

[agents]
# Parallelize bounded read-only discovery and triage, not VM execution or
# overlapping edits. Model and reasoning settings intentionally inherit from
# the parent session.
enabled = true
max_concurrent_threads_per_session = 3

[mcp_servers.enoshima_vm]
command = "uv"
args = ["run", "--locked", "--project", "tests/vm", "python", "tests/vm/scripts/mcp_proxy.py"]
# Do not set cwd here. Codex Desktop resolves an explicit relative cwd from the
# app-server process, while omitting it uses the active repository session cwd.
startup_timeout_sec = 30
# Durable run tools return immediately and continue outside the MCP process.
# Retain generous headroom for bounded low-level recovery calls, but do not use
# this timeout as a substitute for vm_wait_operation snapshots.
tool_timeout_sec = 259200
enabled = true
required = true
default_tools_approval_mode = "writes"

[mcp_servers.enoshima_vm.tools.vm_status]
approval_mode = "auto"

[mcp_servers.enoshima_vm.tools.vm_query_desktop]
approval_mode = "auto"

[mcp_servers.enoshima_vm.tools.vm_list_runs]
approval_mode = "auto"

[mcp_servers.enoshima_vm.tools.vm_operation_status]
approval_mode = "auto"

[mcp_servers.enoshima_vm.tools.vm_list_operations]
approval_mode = "auto"

[mcp_servers.enoshima_vm.tools.vm_wait_operation]
approval_mode = "auto"

[mcp_servers.enoshima_vm.tools.verification_plan]
approval_mode = "auto"

[mcp_servers.enoshima_vm.tools.vm_destroy]
approval_mode = "prompt"
