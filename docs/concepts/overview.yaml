  candidate_prompt: |-
    Use case: ui-mockup
    Asset type: Enoshima desktop concept candidate board
    Primary request: Create one high-fidelity 16:9 concept board comparing three feasible visual directions for a Hyprshell-based all-workspaces window overview on the Enoshima Linux desktop.
    Scene/backdrop: a plausible 1920x1080 logical desktop with the existing neon-library-at-night wallpaper dimmed behind the overview; this is a concept board, not a website.
    Required composition:
    - One board split into three clearly labeled equal sections: "A · Workspace Atlas", "B · Quiet Grid", and "C · Focus Rail".
    - Every direction must use only capabilities feasible in Hyprshell: five numbered purpose-led workspace containers labeled "1 DEV", "2 WEB", "3 DOCS", "4 REMOTE", "5 MISC"; real window thumbnail cards inside those containers; one selected window; one empty-workspace treatment; no search box, no launcher, no dock clone, no invented settings.
    - Show Korean as primary UI copy where labels are needed: "모든 작업공간", "창 선택", "빈 작업공간"; include a few realistic English window titles such as "app.tsx", "Documentation", and "Remote Desktop" to expose overflow.
    - A: horizontal five-workspace atlas with restrained clear borders and compact window thumbnails.
    - B: balanced 3+2 grid with maximum thumbnail legibility and simple hierarchy.
    - C: one large selected workspace plus a narrow rail of the other four, but still clearly an all-workspaces overview and feasible as a CSS-only variation.
    - Annotate keyboard focus using a cyan 2px edge plus a small key legend "Super+Tab · 방향키 · Enter · Esc".
    Enoshima contract:
    - deep navy #050623 canvas, #0a0c3e and #161151 surfaces
    - cyan #62d8ff focus, violet #9a5cff selection, sparse magenta #e56bff accent
    - #f2ecff primary text and #c9bfe8 secondary text
    - Pretendard-like Korean typography and Papirus-style symbolic app icons
    - 14px panels, 12px controls, calm dense workstation character, restrained bloom
    Accessibility:
    - selected state is communicated by border, shape and label, not color alone
    - 44px preferred targets and visible keyboard focus
    - include tiny callouts for "감소 모션" and "감소 투명도" showing instant transitions and opaque surfaces
    - exact compact annotations must remain legible
    Constraints: no mobile UI, no web dashboard, no glassmorphism, no emoji controls, no remote fonts, no decorative pseudo-code, no fake terminal, no neon spectacle, no launcher or search field, no extra workspace numbers beyond 1-5, no watermark.
    Output: a single polished three-direction candidate board with annotations outside the production UI areas.
