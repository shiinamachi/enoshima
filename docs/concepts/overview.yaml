surface_id: overview
status: approved
asset: docs/assets/concepts/overview/overview-v2.png
candidates: docs/assets/concepts/overview/overview-candidates-v1.png
selection: >-
  Direction B, Quiet Grid, maps directly to Hyprshell's three-items-per-row
  FlowBox and directional grid navigation. The v2 correction uses the package's
  real workspace and Papirus application-icon cards rather than invented live
  thumbnails, and keeps the incomplete second row left-aligned like upstream.
states:
  - all-workspaces
  - selected-window
  - selected-workspace
  - multi-monitor
  - no-windows
  - reduced-motion
  - reduced-transparency
invariants:
  - The overview is an all-workspaces window map, never a launcher, search surface, or Dock clone.
  - Inactive empty workspaces are omitted; the current active workspace remains visible without clients and receives no synthetic client or message.
  - A selected window uses a cyan 2px edge plus a shape marker; a selected workspace uses a violet 2px edge plus an inset marker.
  - Super+Tab opens the overview while native Alt+Tab and Alt+Shift+Tab remain available as the fast current-workspace fallback.
  - The 3+2 grid follows Hyprshell's items_per_row value of 3, keeps the second row left-aligned, and preserves upstream icon-card placement within each workspace.
  - No CSS transitions, continuous animation, blur, or transparency-dependent state is introduced.
behavior:
  - Arrow keys move through the grid, Enter activates the selected window or workspace, and Escape closes without changing focus.
  - Pointer activation and keyboard activation target the same Hyprland client or workspace.
  - Long application titles ellipsize without changing workspace or client geometry.
  - Multiple monitors render independent monitor groups while preserving the same focus hierarchy and icon-card structure.
implementation_constraints:
  - Enable only Hyprshell windows.overview; disable standalone launcher UI and all launcher plugins while retaining its required nonvisual keyboard controller, and omit switch and switch_2.
  - Keep filter_by_current_workspace, filter_by_current_monitor, and filter_by_same_class disabled.
  - Use solid Enoshima surfaces so the default rendering also satisfies the reduced-transparency contract.
  - Keep the packaged user service and configuration check as the external component boundary.
  - Use Papirus-resolved application icons and the managed local font stack; introduce no icon or font dependency.
  - Keep upstream workspace and application icon cards; do not simulate live window thumbnails or spatial miniatures that Hyprshell does not render.
acceptance:
  - Workspaces 1 through 5 with live clients appear as legible workspace and application-icon cards in a predictable left-aligned 3+2 reading order on internal and external displays.
  - Korean and English window titles remain readable or ellipsize at 1.0, 1.25, and 2.0 scale.
  - Window and workspace selection remain distinguishable without relying on color alone.
  - The no-windows state shows only the current empty workspace container, without fabricated clients or an empty-state message.
  - Reduced-motion and reduced-transparency profiles require no alternate animation or blur path.
