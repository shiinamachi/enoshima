name: Trusted VM integration

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification mode or diagnostic VM suite to run
        required: true
        default: checkpoint
        type: choice
        options:
          - checkpoint
          - release
          - smoke
          - converge
          - reboot
          - desktop
          - login
          - ui-review
          - full

permissions:
  contents: read

concurrency:
  group: enoshima-kvm
  cancel-in-progress: false

jobs:
  vm:
    runs-on: [self-hosted, linux, x64, enoshima-kvm, trusted]
    # Seven serial suite budgets total 1,830 minutes and each suite may receive
    # one fresh-overlay infrastructure retry. Retain cleanup/evidence headroom
    # around the 3,660-minute worst case on the trusted self-hosted runner.
    timeout-minutes: 4320
    env:
      ENOSHIMA_VM_STATE_ROOT: /tmp/enoshima-vm-state-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4
        with:
          # A push may contain multiple commits; the affected selector must
          # compare the new HEAD with the event's complete pre-push base.
          fetch-depth: 0

      - name: Check KVM host boundary
        run: make vm-preflight

      - name: Run selected verification
        env:
          REQUESTED_SUITE: ${{ inputs.suite || 'checkpoint' }}
          ENOSHIMA_PUSH_BASE: ${{ github.event.before }}
        run: |
          checkpoint_base=origin/main
          if [[ "$GITHUB_EVENT_NAME" == push &&
                "$ENOSHIMA_PUSH_BASE" =~ ^[0-9a-f]{40}$ &&
                "$ENOSHIMA_PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            checkpoint_base=$ENOSHIMA_PUSH_BASE
          fi
          case "$REQUESTED_SUITE" in
            checkpoint) make vm-checkpoint BASE="$checkpoint_base" ;;
            release|full) make vm-release BASE="$checkpoint_base" ;;
            smoke|converge|reboot|desktop|login|ui-review) make "vm-$REQUESTED_SUITE" ;;
            *) exit 2 ;;
          esac

      - name: Remove disposable domains and media
        if: always()
        run: make vm-clean

      - name: Upload VM evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enoshima-vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ENOSHIMA_VM_STATE_ROOT }}/plans/*/plan.json
            ${{ env.ENOSHIMA_VM_STATE_ROOT }}/checks/**
            ${{ env.ENOSHIMA_VM_STATE_ROOT }}/runs/*/run.json
            ${{ env.ENOSHIMA_VM_STATE_ROOT }}/runs/*/artifacts/**
            ${{ env.ENOSHIMA_VM_STATE_ROOT }}/audit.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Remove uploaded run reports
        if: always() && steps.upload-evidence.outcome == 'success'
        run: |
          expected="/tmp/enoshima-vm-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$ENOSHIMA_VM_STATE_ROOT" = "$expected"
          rm -rf -- "$expected"
