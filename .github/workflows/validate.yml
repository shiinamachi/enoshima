name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install validation dependencies
        run: >-
          pacman -Syu --needed --noconfirm
          7zip actionlint ansible-core chezmoi desktop-file-utils git gtk3 gtk4 hyprland imagemagick jq
          json-glib librsvg lua python python-gobject python-yaml ripgrep shellcheck
          shfmt uv yq
          && useradd --create-home --shell /bin/bash ci

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare unprivileged validation user
        run: |
          chown -R ci:ci "$GITHUB_WORKSPACE"
          ci_uid=$(id -u ci)
          install -d -m 0700 -o ci -g ci "/run/user/$ci_uid"

      - name: Install pinned Ansible collection
        run: >-
          runuser --user ci -- env HOME=/home/ci
          ansible-galaxy collection install -r ansible/collections/requirements.yml

      - name: Validate desired state
        run: >-
          runuser --user ci -- env HOME=/home/ci
          XDG_RUNTIME_DIR=/run/user/$(id -u ci) ./scripts/validate.sh

      - name: Verify protected AUR provenance online
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          runuser --user ci -- env HOME=/home/ci
          GITHUB_TOKEN="$GITHUB_TOKEN"
          ./scripts/lib/aur-provenance validate
          --lock packages/aur-provenance.json
          --manifest packages/aur.txt
          --require-manifest-membership
          --online

      - name: Verify pinned Vicinae release provenance online
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          runuser --user ci -- env HOME=/home/ci
          GITHUB_TOKEN="$GITHUB_TOKEN"
          ./scripts/check-vicinae-provenance --online

      - name: Verify pinned Hyprshell source provenance online
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          runuser --user ci -- env HOME=/home/ci
          GITHUB_TOKEN="$GITHUB_TOKEN"
          ./scripts/check-hyprshell-provenance --online

      - name: Verify locked VM runner independently
        run: |
          runuser --user ci -- env HOME=/home/ci uv lock --check --project tests/vm
          runuser --user ci -- env HOME=/home/ci uv run --locked --project tests/vm pytest
          runuser --user ci -- env HOME=/home/ci uv run --locked --project tests/vm ruff check tests/vm/src tests/vm/unit
