[Unit]
StartLimitIntervalSec=300
StartLimitBurst=2

[Service]
ExecCondition=%h/.local/libexec/vicinae-keyring-ready
ExecStart=
ExecStart=/usr/bin/vicinae server --replace
ExecReload=
ExecStartPost=%h/.local/libexec/vicinae-server-ready
Environment=VICINAE_NODE_BIN=/usr/bin/node HOME=%h XDG_CONFIG_HOME=%h/.config XDG_DATA_HOME=%h/.local/share XDG_STATE_HOME=%h/.local/state XDG_CACHE_HOME=%h/.cache "EMOJI_FONT=Noto Color Emoji"
UnsetEnvironment=QT_NO_GLIB LD_LIBRARY_PATH LD_PRELOAD LD_AUDIT QT_PLUGIN_PATH QML_IMPORT_PATH QML2_IMPORT_PATH QT_QPA_PLATFORM_PLUGIN_PATH VICINAE_OVERRIDES
KillMode=control-group
Restart=on-failure
RestartSec=60
TimeoutStartSec=40
TimeoutStopSec=10
