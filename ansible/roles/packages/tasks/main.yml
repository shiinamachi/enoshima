---
- name: Read native package manifest
  ansible.builtin.set_fact:
    native_packages: >-
      {{
        lookup('ansible.builtin.file', playbook_dir + '/../packages/native.txt').splitlines()
        | map('regex_replace', '#.*$', '')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Read management package manifest
  ansible.builtin.set_fact:
    management_packages: >-
      {{
        lookup('ansible.builtin.file', playbook_dir + '/../packages/management.txt').splitlines()
        | map('regex_replace', '#.*$', '')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Read VM host package manifest
  ansible.builtin.set_fact:
    vm_host_packages: >-
      {{
        lookup('ansible.builtin.file', playbook_dir + '/../packages/vm-host.txt').splitlines()
        | map('regex_replace', '#.*$', '')
        | map('trim')
        | reject('equalto', '')
        | list
      }}
  when: enoshima_capabilities.vm_test_host | bool

- name: Read optional dependency manifest
  ansible.builtin.set_fact:
    optional_dependency_packages: >-
      {{
        lookup('ansible.builtin.file', playbook_dir + '/../packages/optional-deps.txt').splitlines()
        | map('regex_replace', '#.*$', '')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Read absent package manifest
  ansible.builtin.set_fact:
    absent_packages: >-
      {{
        lookup('ansible.builtin.file', playbook_dir + '/../packages/absent.txt').splitlines()
        | map('regex_replace', '#.*$', '')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Compose desired native and management package set
  ansible.builtin.set_fact:
    desired_packages: >-
      {{
        (native_packages
        + management_packages
        + (additional_native_packages | default([]))
        + (vm_host_packages | default([])))
        | unique
        | list
      }}

- name: Compose package prefetch set
  ansible.builtin.set_fact:
    pacman_prefetch_packages: >-
      {{
        (desired_packages + optional_dependency_packages)
        | unique
        | list
      }}

- name: Configure pacman repositories before package operations
  ansible.builtin.template:
    src: pacman.conf.j2
    dest: /etc/pacman.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: pacman_configuration
  when: manage_pacman_config | bool

- name: Prefetch reproducible package payload with bounded retries
  when: pacman_prefetch_timeout_seconds | int > 0
  block:
    - name: Install transient bounded pacman prefetch helper
      ansible.builtin.template:
        src: pacman-prefetch.sh.j2
        dest: /run/enoshima-pacman-prefetch
        owner: root
        group: root
        mode: "0700"
      changed_when: false

    - name: Download desired package payload before transactions
      ansible.builtin.command:
        argv: "{{ ['/run/enoshima-pacman-prefetch'] + pacman_prefetch_packages }}"
      changed_when: false
  always:
    - name: Remove transient bounded pacman prefetch helper
      ansible.builtin.file:
        path: /run/enoshima-pacman-prefetch
        state: absent
      changed_when: false

- name: Perform supported full system upgrade
  community.general.pacman:
    update_cache: true
    upgrade: true
  register: full_upgrade_result
  retries: 4
  delay: 10
  until: full_upgrade_result is succeeded
  when: >-
    (perform_full_upgrade | bool)
    or (pacman_configuration is changed)

- name: Inspect installed packages before removals
  ansible.builtin.package_facts:
    manager: pacman

- name: Stop and disable power-profiles-daemon before replacement
  ansible.builtin.systemd_service:
    name: power-profiles-daemon.service
    enabled: false
    state: stopped
  when:
    - "'power-profiles-daemon' in absent_packages"
    - "'power-profiles-daemon' in ansible_facts.packages"

- name: Remove packages declared absent
  community.general.pacman:
    name: "{{ absent_packages }}"
    state: absent
  when: absent_packages | length > 0

- name: Install desired native and management packages
  community.general.pacman:
    name: "{{ desired_packages }}"
    state: present
  register: desired_packages_install
  retries: 4
  delay: 10
  until: desired_packages_install is succeeded

- name: Install desired optional dependencies as dependencies
  community.general.pacman:
    name: "{{ optional_dependency_packages }}"
    state: present
    extra_args: --asdeps
  register: optional_packages_install
  retries: 4
  delay: 10
  until: optional_packages_install is succeeded
  when: optional_dependency_packages | length > 0
