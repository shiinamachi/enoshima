---
- name: Configure user-scoped Flatpak remotes
  community.general.flatpak_remote:
    name: "{{ item.name }}"
    flatpakrepo_url: "{{ item.url }}"
    method: user
    state: present
  register: flatpak_remote_result
  retries: 4
  delay: 10
  until: flatpak_remote_result is succeeded
  loop: "{{ flatpak_user_remotes }}"

- name: Install user-scoped Flatpak applications
  community.general.flatpak:
    name: "{{ flatpak_user_applications }}"
    method: user
    remote: flathub
    state: present
  # The module buffers libostree output until completion. Bound that silent
  # interval below the VM bootstrap's dedicated no-output budget.
  async: 1800
  poll: 30
